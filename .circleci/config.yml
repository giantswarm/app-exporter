version: 2.1

orbs:
  architect: giantswarm/architect@10.1.0

workflows:
  build:
    jobs:
    - architect/go-build:
        context: architect
        name: go-build
        binary: app-exporter
        filters:
          tags:
            only: /^v.*/

    - architect/push-to-registries:
        context: architect
        name: push-to-registries
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/

          branches:
            ignore:
            - main
            - master
    - architect/push-to-app-catalog:
        context: architect
        executor: app-build-suite
        name: push-to-app-catalog
        app_catalog: control-plane-catalog
        app_catalog_test: control-plane-test-catalog
        chart: app-exporter
        persist_chart_archive: true
        requires:
        - push-to-registries
        filters:
          tags:
            only: /^v.*/

          branches:
            ignore:
            - main
            - master
    - architect/run-tests-with-ats:
        name: run-tests-with-ats
        # Pinned to the app-test-suite that orb 6.x defaulted to. Orb 9.6.0 raised the
        # default to 0.15.0, which creates its KinD cluster from
        # kindest/node:v1.31.12 instead of v1.29.2. On 1.31 the test-app 1.0.0 fixture
        # (kube-state-metrics v1.9.2, released 2020) never reaches Running, so
        # TestMetrics times out after 5 minutes waiting for its pod while app-exporter
        # itself is healthy. Modernising the fixture is the real fix; this repo is
        # lifecycle: deprecated, so it pins instead.
        app-test-suite_version: "v0.10.6"
        app-test-suite_container_tag: "0.10.6"
        requires:
        - push-to-app-catalog
